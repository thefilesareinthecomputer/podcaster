version: 2
updates:
  # One grouped PR per run, so lockfile bumps do not conflict with each other.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed, past the usual window in which a
    # compromised upload is caught and pulled.
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
